<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নজরুল একাডেমি রিইউনিয়ন ২০২৬</title><style>body{font-family:system-ui,sans-serif;background:#f1f6f4;margin:0;color:#153c2b}main{max-width:580px;margin:auto;padding:18px}h2{text-align:center;font-size:23px}.panel{background:white;border-radius:14px;padding:16px;box-shadow:0 4px 18px #0001}label{display:block;margin:12px 0 5px;font-weight:700}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbcfc3;border-radius:8px;font-size:17px}button{width:100%;background:#086239;color:white;border:0;border-radius:9px;padding:14px;margin-top:16px;font-size:18px;font-weight:700}canvas{display:block;width:100%;height:auto;margin:18px auto;border-radius:9px}.hint{font-size:13px;color:#52645b;text-align:center}</style></head><body><main><h2>নজরুল একাডেমি রিইউনিয়ন ২০২৬</h2><div class="panel"><label>নিজের ছবি নির্বাচন করুন</label><input id="photo" type="file" accept="image/*"><label>নাম</label><input id="name" placeholder="আপনার নাম লিখুন" maxlength="34"><label>ব্যাচ</label><input id="batch" placeholder="যেমন: ২০২০" maxlength="12"><canvas id="card" width="1254" height="1254"></canvas><button id="save">ফটো কার্ড ডাউনলোড করুন</button><p class="hint">আপনার ছবি শুধু আপনার ফোনেই প্রক্রিয়াকরণ হয়।</p></div></main><script>
const c=document.getElementById('card'),ctx=c.getContext('2d'),photoInput=document.getElementById('photo'),nameInput=document.getElementById('name'),batchInput=document.getElementById('batch');let portrait=null;const bg=new Image();bg.src='frame.png';bg.onload=render;const beng=n=>String(n).replace(/[0-9]/g,x=>'০১২৩৪৫৬৭৮৯'[+x]);
function render(){if(!bg.complete||!bg.naturalWidth)return;ctx.clearRect(0,0,1254,1254);ctx.drawImage(bg,0,0,1254,1254);if(portrait){ctx.save();ctx.beginPath();ctx.arc(615,435,222,0,Math.PI*2);ctx.clip();const scale=Math.max(444/portrait.width,444/portrait.height);const w=portrait.width*scale,h=portrait.height*scale;ctx.drawImage(portrait,615-w/2,435-h/2,w,h);ctx.restore();}function field(value,y){if(!value)return;ctx.fillStyle='#fff';ctx.fillRect(493,y-48,488,56);ctx.fillStyle='#111';let size=42;ctx.font='bold '+size+'px sans-serif';while(ctx.measureText(value).width>465&&size>23){size-=2;ctx.font='bold '+size+'px sans-serif';}ctx.fillText(value,504,y);}field(nameInput.value.trim(),722);field(beng(batchInput.value.trim()),804);}
photoInput.addEventListener('change',()=>{const f=photoInput.files[0];if(!f)return;const url=URL.createObjectURL(f);const img=new Image();img.onload=()=>{portrait=img;URL.revokeObjectURL(url);render()};img.src=url});nameInput.addEventListener('input',render);batchInput.addEventListener('input',render);document.getElementById('save').addEventListener('click',()=>{render();const a=document.createElement('a');a.download='Nazrul-Academy-Reunion-2026.png';a.href=c.toDataURL('image/png');a.click()});
</script></body></html>
